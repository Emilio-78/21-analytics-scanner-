
name: Build 21 Analytics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          unzip -q 21-analytics-cloud-build.zip -d project
          test -f project/settings.gradle.kts

      - name: Build APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 21-analytics-scanner-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

